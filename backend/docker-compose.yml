# backend/docker-compose.yml —— 全新机器独立部署（自带 PG 实例 + 发布宿主端口）。
# 生产服务器（tengxun1）不用这个文件，用 compose.server.yml + .env.production
# （共享 global_network + 共享 postgres，zhongbei-auth 同款惯例）。
#
# 用法：
#   cp .env.example .env   # 填 DATABASE_URL、MODEL_*、ENTITLEMENT_SIGNING_SECRET、POSTGRES_PASSWORD
#   docker compose up -d --build
services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: geekread
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: geekread
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geekread"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: .
    image: geekread-backend:latest
    container_name: geekread-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://geekread:${POSTGRES_PASSWORD}@postgres:5432/geekread
      MODEL_API_URL: ${MODEL_API_URL}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_NAME: ${MODEL_NAME}
      ENTITLEMENT_SIGNING_SECRET: ${ENTITLEMENT_SIGNING_SECRET}
      HACKER_NEWS_API_URL: ${HACKER_NEWS_API_URL:-}
      WARM_CACHE_TOKEN: ${WARM_CACHE_TOKEN:-}
    ports:
      - "8787:8787"
    restart: unless-stopped

volumes:
  pgdata:
